name: Firebase App Distribution

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: firebase-distribution-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  distribute:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firebase-distribution
    env:
      FIREBASE_APP_ID: ${{ vars.FIREBASE_DEBUG_APP_ID }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
      ORG_GRADLE_PROJECT_challaDebugBaseUrl: ${{ secrets.DEBUG_BASE_URL }}
      ORG_GRADLE_PROJECT_challaKakaoNativeAppKey: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
      ORG_GRADLE_PROJECT_challaDebugStorePassword: ${{ secrets.DEBUG_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_challaDebugKeyAlias: ${{ secrets.DEBUG_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_challaDebugKeyPassword: ${{ secrets.DEBUG_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate distribution configuration
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          : "${FIREBASE_APP_ID:?FIREBASE_DEBUG_APP_ID variable is not configured}"
          : "${FIREBASE_TESTER_GROUPS:?FIREBASE_TESTER_GROUPS variable is not configured}"
          : "${ORG_GRADLE_PROJECT_challaDebugBaseUrl:?DEBUG_BASE_URL secret is not configured}"
          : "${ORG_GRADLE_PROJECT_challaKakaoNativeAppKey:?KAKAO_NATIVE_APP_KEY secret is not configured}"
          : "${ORG_GRADLE_PROJECT_challaDebugStorePassword:?DEBUG_STORE_PASSWORD secret is not configured}"
          : "${ORG_GRADLE_PROJECT_challaDebugKeyAlias:?DEBUG_KEY_ALIAS secret is not configured}"
          : "${ORG_GRADLE_PROJECT_challaDebugKeyPassword:?DEBUG_KEY_PASSWORD secret is not configured}"
          : "${DEBUG_KEYSTORE_BASE64:?DEBUG_KEYSTORE_BASE64 secret is not configured}"
          : "${GOOGLE_SERVICES_JSON_BASE64:?GOOGLE_SERVICES_JSON_BASE64 secret is not configured}"
          : "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:?FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 secret is not configured}"

      - name: Restore build configuration
        env:
          ORG_GRADLE_PROJECT_challaDebugStoreFile: ${{ runner.temp }}/challa-debug.keystore
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$ORG_GRADLE_PROJECT_challaDebugStoreFile"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s "$ORG_GRADLE_PROJECT_challaDebugStoreFile"
          test -s app/google-services.json
          printf 'ORG_GRADLE_PROJECT_challaDebugStoreFile=%s\n' "$ORG_GRADLE_PROJECT_challaDebugStoreFile" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("app/google-services.json").read_text())
          clients = [
              client["client_info"]
              for client in config.get("client", [])
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.happyhouse.challa.debug"
          ]
          if not any(client.get("mobilesdk_app_id") == os.environ["FIREBASE_APP_ID"] for client in clients):
              raise SystemExit("FIREBASE_DEBUG_APP_ID must match com.happyhouse.challa.debug in google-services.json")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Build signed debug APK
        run: |
          ./gradlew :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Create release notes
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          summary = subprocess.check_output(["git", "log", "-1", "--format=%s"], text=True).strip()
          notes = (
              f"Branch: {os.environ['GITHUB_REF_NAME']}\n"
              f"Commit: {os.environ['GITHUB_SHA']}\n"
              f"Changes: {summary}\n"
              f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}\n"
          )
          Path("release-notes.txt").write_text(notes)
          PY

      - name: Archive APK and release notes
        uses: actions/upload-artifact@v4
        with:
          name: challa-debug-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            release-notes.txt
          if-no-files-found: error
          retention-days: 14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@14.12.0

      - name: Restore Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          test -s "$RUNNER_TEMP/firebase-service-account.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          credentials = json.loads((Path(os.environ["RUNNER_TEMP"]) / "firebase-service-account.json").read_text())
          if credentials.get("type") != "service_account" or not all(
              credentials.get(field) for field in ("project_id", "client_email", "private_key")
          ):
              raise SystemExit("FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 must contain a service account JSON key")
          PY

      - name: Distribute to testers
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes-file release-notes.txt \
            --non-interactive
          printf 'Firebase App Distribution succeeded.\n\nCommit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: echo 'Firebase App Distribution failed. Check the failed step; the APK artifact is available if archiving succeeded.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing and Firebase configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/challa-debug.keystore" "$RUNNER_TEMP/firebase-service-account.json" app/google-services.json
