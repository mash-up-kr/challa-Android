name: CI

on:
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          DEBUG_BASE_URL: ${{ secrets.DEBUG_BASE_URL }}
          RELEASE_KAKAO_NATIVE_APP_KEY: ${{ secrets.RELEASE_KAKAO_NATIVE_APP_KEY }}
          DEBUG_KAKAO_NATIVE_APP_KEY: ${{ secrets.DEBUG_KAKAO_NATIVE_APP_KEY }}
        run: |
          echo "debug.base.url=${DEBUG_BASE_URL}" >> local.properties
          echo "release.base.url=${DEBUG_BASE_URL}" >> local.properties
          echo "release.kakao.native.app.key=${RELEASE_KAKAO_NATIVE_APP_KEY}" >> local.properties
          echo "debug.kakao.native.app.key=${DEBUG_KAKAO_NATIVE_APP_KEY}" >> local.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not configured"
            exit 1
          fi

          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" \
            | base64 --decode \
            > app/google-services.json

          test -s app/google-services.json

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Build (debug)
        run: ./gradlew assembleDebug
