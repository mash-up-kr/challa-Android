name: CI

on:
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate debug build configuration
        env:
          ORG_GRADLE_PROJECT_challaDebugBaseUrl: ${{ secrets.DEBUG_BASE_URL }}
          ORG_GRADLE_PROJECT_challaKakaoNativeAppKey: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          : "${ORG_GRADLE_PROJECT_challaDebugBaseUrl:?DEBUG_BASE_URL secret is not configured}"
          : "${ORG_GRADLE_PROJECT_challaKakaoNativeAppKey:?KAKAO_NATIVE_APP_KEY secret is not configured}"

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not configured"
            exit 1
          fi

          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" \
            | base64 --decode \
            > app/google-services.json

          test -s app/google-services.json

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Build (debug)
        env:
          ORG_GRADLE_PROJECT_challaDebugBaseUrl: ${{ secrets.DEBUG_BASE_URL }}
          ORG_GRADLE_PROJECT_challaKakaoNativeAppKey: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: ./gradlew assembleDebug
